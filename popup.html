<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payload Inspector Pro</title>
    <style>
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        .header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #00e676;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .status-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            min-height: 50px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .alert-item {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        #killSwitchBtn {
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(211, 47, 47, 0.3);
        }
        #killSwitchBtn:hover {
            background-color: #b71c1c;
        }
        #killSwitchBtn:disabled {
            background-color: #424242;
            color: #757575;
            box-shadow: none;
            cursor: not-allowed;
        }
        .warning-icon {
            color: #ff5252;
            font-size: 16px;
            display: none;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">Payload Inspector Pro</div>
    <div id="warningIcon" class="warning-icon">⚠️ SÄKERHETSRISK UPPTÄCKT ⚠️</div>
    
    <div class="status-box" id="alertContainer">
        <div style="font-size: 12px; color: #888; text-align: center; padding-top: 15px;">Ingen suspekt trafik detekterad.</div>
    </div>

    <button id="killSwitchBtn">⚡ NÄTVERK KILL SWITCH</button>

    <script src="popup.js"></script>
</body>
</html>
