name: Build GhostyTube iOS dylib
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -dynamiclib -fobjc-arc \
            -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -install_name @rpath/VolumeBoostYT.dylib \
            ghostytube-build/GhostyVolumeClean.m \
            -o ghostytube-build/VolumeBoostYT.dylib
          file ghostytube-build/VolumeBoostYT.dylib
          otool -L ghostytube-build/VolumeBoostYT.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: GhostyVolume-dylib
          path: ghostytube-build/VolumeBoostYT.dylib
