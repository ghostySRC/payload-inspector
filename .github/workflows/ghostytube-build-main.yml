name: GhostyTube Dylib Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build iOS arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation -framework AVFoundation \
            -install_name @rpath/VolumeBoostYT.dylib \
            ghostytube-build/GhostyVolumeClean.m -o ghostytube-build/VolumeBoostYT.dylib
          file ghostytube-build/VolumeBoostYT.dylib
          otool -L ghostytube-build/VolumeBoostYT.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: GhostyVolume-dylib
          path: ghostytube-build/VolumeBoostYT.dylib
